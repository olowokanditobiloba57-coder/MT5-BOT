name: Run MT5 Bot

on:
  push:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tickerall yfinance pandas numpy forexfactory

    - name: Run the bot
      env:
        TICKERALL_API_KEY: ${{ secrets.TICKERALL_API_KEY }}
        TICKERALL_ACCOUNT_ID: ${{ secrets.TICKERALL_ACCOUNT_ID }}
      run: python multi_tf_bot.py
