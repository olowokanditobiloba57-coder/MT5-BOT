name: Run MT5 Bot

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows you to run it manually to test

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fxapis yfinance pandas

    - name: Run the bot
      env:
        FXAPIS_API_KEY: ${{ secrets.FXAPIS_API_KEY }}
      run: python multi_tf_bot.py
